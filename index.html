<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="description" content="Spotlight360 — Hyperlocal short-video news & marketplace platform." />
    <meta name="referrer" content="no-referrer" />
    <meta property="og:site_name" content="Spotlight 360" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Spotlight 360 — Hyperlocal News & Marketplace" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spotlight 360 — Hyperlocal News & Marketplace" />

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Identity Services (GSI) Client -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
